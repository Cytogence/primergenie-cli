[package]
name = "primer-genie"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI tool for designing gene-specific primers"
license = "MIT"
authors = ["Kenneth"]

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime and HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }

# Compression
flate2 = "1"

# Parallel processing
rayon = "1"

# Progress bars
indicatif = "0.17"

# XDG directories
directories = "5"
dirs = "5"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# String matching for specificity
aho-corasick = "1"

# Futures for async streams
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "primer-genie"
path = "src/main.rs"
